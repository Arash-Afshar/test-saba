<section class="route-preview" aria-label="Route preview">
  <div class="route-preview-header">
    <h2 class="route-title">Route Preview</h2>
  </div>
  
  <div class="route-info">
    <div class="route-point start-point">
      <div class="point-label">Start</div>
      <div class="point-name" id="startName">-</div>
      <div class="point-details" id="startDetails">-</div>
    </div>
    
    <div class="route-distance">
      <div class="distance-value" id="distanceValue">-</div>
      <div class="distance-label">Distance</div>
    </div>
    
    <div class="route-point end-point">
      <div class="point-label">Destination</div>
      <div class="point-name" id="endName">-</div>
      <div class="point-details" id="endDetails">-</div>
    </div>
  </div>

  <section class="route-steps-panel" aria-label="Route steps">
    <h3 class="route-steps-title">Steps</h3>
    <div id="routeStepBox" class="route-step-box" style="display: none;">
      <span id="routeStepCurrent" class="route-step-text"></span>
      <button id="routeStepPrev" class="button button--secondary" type="button">Previous</button>
      <button id="routeStepNext" class="button button--secondary" type="button">Next</button>
    </div>
  </section>
  
  <div class="map-container">
    <div id="poiTooltip" class="poi-tooltip"></div>
    <svg id="floorMap" class="floor-map" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <!-- POI markers will be drawn here -->
    </svg>
    <div class="map-legend">
      <div class="legend-item">
        <span class="legend-marker start-marker"></span>
        <span>Start</span>
      </div>
      <div class="legend-item">
        <span class="legend-marker end-marker"></span>
        <span>Destination</span>
      </div>
      <div class="legend-item">
        <span class="legend-marker poi-marker"></span>
        <span>Other POIs</span>
      </div>
    </div>
  </div>

  <div
    id="routeErrorModal"
    class="modal"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="routeErrorTitle"
    aria-describedby="routeErrorMessage"
    hidden
  >
    <div class="modal__backdrop" data-close="true"></div>
    <div class="modal__dialog" role="document">
      <h3 id="routeErrorTitle" class="modal__title">Route unavailable</h3>
      <p id="routeErrorMessage" class="modal__message"></p>
      <button id="routeErrorClose" class="button" type="button">Close</button>
    </div>
  </div>

  <div
    id="arrivedModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="arrivedTitle"
    hidden
  >
    <div class="modal__backdrop" data-close="true"></div>
    <div class="modal__dialog modal__dialog--success" role="document">
      <h3 id="arrivedTitle" class="modal__title">You are arrived.</h3>
      <button id="arrivedClose" class="button" type="button">OK</button>
    </div>
  </div>
</section>
